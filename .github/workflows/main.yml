name: Android Cloud APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Auto Initialize Android Structure
        run: |
          mkdir -p app/src/main/java/com/smsfix/app
          mv AndroidManifest.xml app/src/main/
          mv SMSInterceptor.java app/src/main/java/com/smsfix/app/
          mv MainActivity.java app/src/main/java/com/smsfix/app/
          echo "plugins { id 'com.android.application' version '8.2.0' }" > settings.gradle
          echo "rootProject.name = 'SMSFix'" >> settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { compileSdk 34; defaultConfig { applicationId 'com.smsfix.app'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' } }" >> app/build.gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Compile and Build APK
        run: ./gradlew assembleDebug
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSFix-Installer
          path: app/build/outputs/apk/debug/app-debug.apk
