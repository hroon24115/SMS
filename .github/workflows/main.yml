name: Android Cloud APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Initialize Complete Android Structure
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/smsfix/app
          
          # Move your files into the structure
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || echo "Manifest ready"
          [ -f SMSInterceptor.java ] && mv SMSInterceptor.java app/src/main/java/com/smsfix/app/ || echo "Interceptor ready"
          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/smsfix/app/ || echo "MainActivity ready"
          
          # Generate robust top-level build.gradle with correct repositories
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          # Generate settings.gradle
          echo "include ':app'" > settings.gradle
          
          # Generate app-level build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.smsfix.app'
              defaultConfig {
                  applicationId "com.smsfix.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF
          
          # Generate a tiny dummy strings file to prevent compilation crashes
          echo '<resources><string name="app_name">SMSFix</string></resources>' > app/src/main/res/values/strings.xml
          
          # Force generate the wrapper tools
          gradle wrapper
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Compile and Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSFix-Installer
          path: app/build/outputs/apk/debug/app-debug.apk
