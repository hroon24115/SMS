name: Android Cloud APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Initialize Complete Android Structure
        run: |
          # Create fresh target folders safely
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/smsfix/app
          
          # Force clean all legacy root duplicates to prevent overlap crashes
          rm -f AndroidManifest.xml
          rm -f SMSInterceptor.java
          rm -f MainActivity.java
          
          # Decode AndroidManifest.xml safely
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          
          # Decode SMSInterceptor.java safely (Typo Fix Applied)
          echo "" | base64 -d > app/src/main/java/com/smsfix/app/SMSInterceptor.java
          
          # Decode MainActivity.java safely
          echo "" | base64 -d > app/src/main/java/com/smsfix/app/MainActivity.java
          
          # Decode build.gradle safely
          echo "" | base64 -d > build.gradle
          
          # Decode app/build.gradle safely
          echo "" | base64 -d > app/build.gradle
          
          # Generate minor configuration lines
          echo "include ':app'" > settings.gradle
          echo '<resources><string name="app_name">SMSFix</string></resources>' > app/src/main/res/values/strings.xml
          
          # Materialize compile tool wrapper
          gradle wrapper
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Compile and Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSFix-Installer
          path: app/build/outputs/apk/debug/app-debug.apk
