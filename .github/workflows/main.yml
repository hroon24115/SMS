name: Android Cloud APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Initialize Complete Android Structure
        run: |
          # Create fresh target folders
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/smsfix/app
          
          # Move your Java files safely into the correct folders if present
          [ -f SMSInterceptor.java ] && mv SMSInterceptor.java app/src/main/java/com/smsfix/app/ || echo "Interceptor positioned"
          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/smsfix/app/ || echo "MainActivity positioned"
          
          # CRUCIAL: Force delete old files from the root directory to stop merger crashes
          rm -f AndroidManifest.xml
          rm -f SMSInterceptor.java
          rm -f MainActivity.java
          
          # Write the perfect manifest directly to the correct app destination
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <application 
                  android:allowBackup="true" 
                  android:label="SMSFix">
                  <receiver android:name="com.smsfix.app.SMSInterceptor" android:exported="true" android:enabled="true">
                      <intent-filter android:priority="2147483647">
                          <action android:name="SMS_SENT" />
                      </intent-filter>
                  </receiver>
                  <activity android:name="com.smsfix.app.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Generate top-level build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          # Generate settings.gradle
          echo "include ':app'" > settings.gradle
          
          # Generate app-level build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.smsfix.app'
              defaultConfig {
                  applicationId "com.smsfix.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF
          
          # Generate a tiny strings file
          echo '<resources><string name="app_name">SMSFix</string></resources>' > app/src/main/res/values/strings.xml
          
          # Force generate the wrapper tools
          gradle wrapper
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Compile and Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSFix-Installer
          path: app/build/outputs/apk/debug/app-debug.apk
